<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="journal-style.css">
    <title>Log | Workspace Core</title>
</head>
<body class="journal-body">

    <canvas id="canvas-stars"></canvas>

    <nav class="navbar">
        <div class="nav-content">
            <span class="logo">LOG // CORE</span>
            <button id="logoutBtn" class="btn-logout">ABORT_SESSION</button>
        </div>
    </nav>

    <main class="container">
        <section class="input-section">
            <div class="entry-meta">
                <input type="text" id="entryTitle" placeholder="OBSERVATION_TARGET (TITLE)" autocomplete="off">
                <span id="liveClock">SOL_INDEX: LOADING...</span>
            </div>

            <textarea id="entryInput" placeholder="Initialize entry  here..." autocomplete="off"></textarea>
            
            <div class="actions">
                <button id="saveBtn">COMMIT_LOG</button>
            </div>
            
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Filter archives..." autocomplete="off">
            </div>
        </section>

        <div id="entriesList"></div>
    </main>

    <script type="module" src="journal-script.js"></script>
</body>
</html>
