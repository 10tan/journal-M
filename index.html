<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-style.css">
    <title>Observatory Core | Stellar Log</title>
</head>
<body>
    <canvas id="canvas-stars"></canvas>

    <div class="login-container">
        <div class="login-card">
            <div class="security-header">
                <div class="pulsar-icon"></div>
                <span class="status-text">HI, CUTIE</span>
            </div>
            
            <h1>JOURNALS</h1>
            <p class="subtitle">Personal Archive</p>

            <div class="input-group">
                <input type="text" id="username" placeholder="OBSERVER_ID" required autocomplete="off">
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="PASSKEY" required autocomplete="off">
            </div>

            <div class="button-wrapper">
                <button type="button" id="loginBtn">ACCESS_JOURNAL</button>
            </div>
            
            <div id="errorMessage"></div>
        </div>
    </div>

    <script type="module" src="login-script.js"></script>
</body>
</html>
